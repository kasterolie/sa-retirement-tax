[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sa-retirement-tax"
version = "0.1.0"
description = "Generic South African retirement fund calculations: SARS lump sum tax, late-payment interest, SA business days."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/sa_retirement_tax"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
